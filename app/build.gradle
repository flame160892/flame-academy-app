plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flame.academy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.flame.academy'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ditandatangani dengan debug key supaya APK langsung bisa dipasang di HP
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
